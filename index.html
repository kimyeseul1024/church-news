<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 광주은광교회 초등2부 교회소식</title>

  <meta property="og:title" content="2026 광주은광교회 초등2부 교회소식">
  <meta property="og:description" content="외울 말씀과 퀴즈, 그리고 신나는 미션이 기다리고 있어요! ✨">
  <meta property="og:image" content="https://kimyeseul1024.github.io/church-news/thumbnail.png">
  <meta property="og:url" content="https://kimyeseul1024.github.io/church-news/">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at center, #fffbeb 0%, #e0f2fe 50%, #fce7f3 100%);
      background-attachment: fixed;
      color: #4a044e;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
        radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
        radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
      background-size: 550px 550px, 350px 350px, 250px 250px;
      background-position: 0 0, 40px 60px, 130px 270px;
      opacity: 0.6;
      z-index: -1;
    }

    .container {
      background: rgba(255, 255, 255, 0.93);
      max-width: 640px;
      width: 100%;
      padding: 35px 22px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(124, 58, 237, 0.15);
      border: 3px solid white;
      backdrop-filter: blur(10px);
    }

    .top-banner {
      width: 100%;
      border-radius: 20px;
      margin-bottom: 25px;
      display: block;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
      border: 4px solid white;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(90deg, #fef08a, #bfdbfe);
      color: #7e22ce;
      font-size: 14px;
      font-weight: 900;
      padding: 8px 20px;
      border-radius: 30px;
      margin-bottom: 16px;
      border: 1px solid #fde047;
    }

    .info-box {
      background: #f5f3ff;
      border: 2px dashed #c4b5fd;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 18px;
      font-size: 15px;
      color: #4c1d95;
      position: relative;
    }
    .info-box::after {
      content: '✨';
      position: absolute; top: -10px; right: -10px;
      font-size: 24px; transform: rotate(15deg);
    }
    .info-box strong { font-weight: 700; color: #6d28d9; }
    .info-box ul { list-style: none; }
    .info-box li { margin-bottom: 12px; word-break: keep-all; line-height: 1.5; display: flex; align-items: flex-start;}
    .info-box li:last-child { margin-bottom: 0; }
    .info-box li strong { margin-right: 6px; flex-shrink: 0; }

    /* 🙏 대표기도 순서 박스 */
    .prayer-box {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 2px solid #fcd34d;
      padding: 18px 20px;
      border-radius: 20px;
      margin-bottom: 25px;
      box-shadow: 0 6px 15px rgba(245, 158, 11, 0.08);
    }
    .prayer-title {
      font-size: 15px;
      font-weight: 900;
      color: #92400e;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .prayer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .prayer-item {
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      border: 1px solid #fde68a;
      transition: all 0.2s ease;
    }
    .prayer-date {
      font-weight: 900;
      color: #b45309;
      background: #fef3c7;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 13px;
    }
    .prayer-name-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prayer-name {
      font-weight: 700;
      color: #451a03;
    }

    .prayer-item.past {
      background: rgba(241, 245, 249, 0.75);
      border-color: #e2e8f0;
      opacity: 0.6;
    }
    .prayer-item.past .prayer-date {
      background: #e2e8f0;
      color: #64748b;
    }
    .prayer-item.past .prayer-name {
      color: #64748b;
      text-decoration: line-through;
    }

    .prayer-item.next-up {
      background: #ffffff;
      border: 2.5px solid #f59e0b;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.22);
      transform: scale(1.01);
    }
    .prayer-item.next-up .prayer-date {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
    }
    .prayer-item.next-up .prayer-name {
      font-weight: 900;
      font-size: 15px;
      color: #78350f;
    }
    .next-badge {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fcd34d;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* 🏰 디즈니 컬러조합 6개 액션 버튼 그룹 */
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }
    .btn {
      flex: 1 1 calc(50% - 10px);
      min-width: 145px;
      padding: 19px 14px;
      font-size: 17px;
      font-weight: 900;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      cursor: pointer;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.25s ease;
      word-break: keep-all;
      line-height: 1.35;
      letter-spacing: -0.3px;
      text-shadow: 0 1px 4px rgba(30, 27, 75, 0.28);
    }
    .btn:hover { transform: translateY(-3px); }

    .btn-live { 
      width: 100%;
      padding: 19px;
      font-size: 18px;
      background: linear-gradient(135deg, #fb7185, #e11d48);
      box-shadow: 0 8px 20px rgba(225, 29, 72, 0.28);
      margin-top: 12px; 
    }

    .btn-primary {
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 55%, #2563eb 100%);
      box-shadow: 0 8px 18px rgba(59, 130, 246, 0.28);
    }
    .btn-secondary {
      background: linear-gradient(135deg, #c084fc 0%, #a855f7 55%, #7e22ce 100%);
      box-shadow: 0 8px 18px rgba(168, 85, 247, 0.28);
    }
    .btn-toon {
      background: linear-gradient(135deg, #f472b6 0%, #ec4899 55%, #db2777 100%);
      box-shadow: 0 8px 18px rgba(236, 72, 153, 0.28);
    }
    .btn-home {
      background: linear-gradient(135deg, #fb923c 0%, #f97316 55%, #ea580c 100%);
      box-shadow: 0 8px 18px rgba(249, 115, 22, 0.28);
    }
    .btn-accent {
      background: linear-gradient(270deg, #fde047, #facc15, #fb923c, #f472b6, #fde047);
      background-size: 350% 350%;
      color: #3b0764;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
      border: 2.5px solid #ffffff;
      animation: rainbowShift 3s ease infinite, dazzlingPulse 1.15s ease-in-out infinite alternate;
    }
    @keyframes rainbowShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes dazzlingPulse {
      0% {
        box-shadow: 0 6px 16px rgba(250, 204, 21, 0.45), 0 0 12px rgba(253, 224, 71, 0.7);
      }
      100% {
        box-shadow: 0 10px 28px rgba(244, 114, 182, 0.75), 0 0 24px rgba(255, 255, 255, 1);
      }
    }
    .btn-info {
      background: linear-gradient(135deg, #2dd4bf 0%, #14b8a6 55%, #0d9488 100%);
      box-shadow: 0 8px 18px rgba(20, 184, 166, 0.28);
    }

    /* 📅 오픈형 캘린더 섹션 */
    .calendar-section {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 22px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.03);
      overflow: hidden;
    }
    .calendar-open-header {
      width: 100%;
      background: linear-gradient(90deg, #f5f3ff 0%, #eff6ff 50%, #fdf2f8 100%);
      padding: 15px 20px;
      font-size: 16px;
      font-weight: 900;
      color: #4c1d95;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .calendar-content-wrap {
      display: block;
      padding: 18px 14px;
    }
    .cal-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    .cal-tab-btn {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      background: #f1f5f9;
      color: #64748b;
      transition: all 0.2s;
    }
    .cal-tab-btn.active {
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
      color: white;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }
    .calendar-container { display: none; }
    .calendar-container.active { display: block; }
    .calendar-header-title {
      font-size: 18px;
      font-weight: 900;
      color: #1e293b;
      margin-bottom: 14px;
      text-align: center;
    }
    .calendar-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin-bottom: 16px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .calendar-table th {
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 2px;
      text-align: center;
      border-bottom: 1px solid #e2e8f0;
    }
    .calendar-table th:first-child { color: #ef4444; }
    .calendar-table th:last-child { color: #3b82f6; }
    .calendar-table td {
      height: 64px;
      border: 1px solid #f1f5f9;
      vertical-align: top;
      padding: 3px 2px;
      font-size: 11px;
      position: relative;
    }
    .day-num {
      font-weight: 700;
      font-size: 12px;
      color: #334155;
      display: block;
      margin-bottom: 2px;
      padding-left: 2px;
    }
    .calendar-table tr td:first-child .day-num { color: #ef4444; }
    .calendar-table tr td:last-child .day-num { color: #3b82f6; }
    .weekday-col { background: #fafaf9; }
    .cal-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 3px;
      border-radius: 4px;
      display: block;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      letter-spacing: -0.4px;
    }
    .bg-pink { background: #fce7f3; color: #db2777; }
    .bg-yellow { background: #fef08a; color: #ca8a04; }
    .bg-green { background: #dcfce7; color: #16a34a; }
    .bg-purple { background: #ede9fe; color: #7c3aed; }
    .bg-blue { background: #e0f2fe; color: #0284c7; }
    .bg-red { background: #fee2e2; color: #dc2626; }

    .schedule-summary {
      background: #f8fafc;
      border-radius: 14px;
      padding: 12px;
      border: 1px solid #e2e8f0;
    }
    .schedule-summary-title {
      font-size: 13px;
      font-weight: 900;
      color: #334155;
      margin-bottom: 8px;
    }
    .schedule-row {
      display: flex;
      align-items: center;
      font-size: 12px;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px dashed #e2e8f0;
    }
    .schedule-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .s-date { min-width: 95px; font-weight: 700; color: #4f46e5; }
    .s-desc { color: #1e293b; font-weight: 700; }

    .checklist {
      background: #fffbeb;
      border: 2px solid #fde68a;
      padding: 24px;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    .checklist h3 {
      font-size: 17px;
      color: #92400e;
      margin-bottom: 18px;
      font-weight: 900;
    }
    .checklist label {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 15px;
      margin-bottom: 14px;
      cursor: pointer;
      word-break: keep-all;
      line-height: 1.5;
      color: #a16207;
    }
    .checklist label:last-child { margin-bottom: 0; }
    .checklist input {
      width: 24px; height: 24px;
      margin-top: 2px;
      accent-color: #f59e0b;
      cursor: pointer; flex-shrink: 0;
      appearance: none;
      border: 2px solid #f59e0b;
      border-radius: 6px;
      background-color: white;
      position: relative;
    }
    .checklist input:checked { background-color: #f59e0b; border-color: #f59e0b; }
    .checklist input:checked::after {
      content: '✔';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white; font-size: 16px; font-weight: 900;
    }
    .checklist input:checked + span {
      text-decoration: line-through;
      color: #d97706; opacity: 0.7;
    }

    /* 🎶 컴팩트 4열 한 줄 찬양율동 영상보기 섹션 */
    .praise-section {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.94), rgba(250, 245, 255, 0.94));
      border: 2px solid rgba(196, 181, 253, 0.75);
      border-radius: 20px;
      padding: 15px 12px;
      margin-bottom: 18px;
      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.08);
    }
    .praise-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 11px;
      padding: 0 2px;
    }
    .praise-title {
      font-size: 15px;
      font-weight: 900;
      background: linear-gradient(90deg, #6d28d9, #db2777);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
    }
    .praise-subtitle {
      font-size: 11px;
      font-weight: 700;
      color: #8b5cf6;
      background: #f3e8ff;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .praise-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .praise-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      border: 1.5px solid #ede9fe;
      box-shadow: 0 5px 12px rgba(76, 29, 149, 0.07);
      transition: transform 0.24s ease, box-shadow 0.24s ease, border-color 0.24s ease;
    }
    .praise-card:hover {
      transform: translateY(-3px);
      border-color: #c084fc;
      box-shadow: 0 10px 18px rgba(124, 58, 237, 0.16);
    }
    .praise-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #1e1b4b;
    }
    .praise-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .praise-card:hover .praise-thumb-wrap img {
      transform: scale(1.05);
    }
    .praise-play-badge {
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.95), rgba(124, 58, 237, 0.95));
      border: 1.5px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .praise-play-badge::after {
      content: '';
      margin-left: 1px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 3.5px 0 3.5px 6.5px;
      border-color: transparent transparent transparent #ffffff;
    }
    .praise-caption {
      padding: 7px 5px;
      font-size: 10.5px;
      font-weight: 900;
      color: #4c1d95;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, #faf5ff 100%);
      letter-spacing: -0.4px;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: keep-all;
    }

    /* ✨ 코드 내장형 디즈니 외울말씀 카드 */
    .embedded-verse-card {
      position: relative;
      width: 100%;
      min-height: 360px;
      border-radius: 20px;
      margin-bottom: 16px;
      padding: 36px 22px;
      background:
        radial-gradient(circle at 22% 18%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 32%),
        radial-gradient(circle at 82% 24%, rgba(255, 249, 196, 0.75) 0%, rgba(255, 249, 196, 0) 34%),
        linear-gradient(165deg, #d8e8ff 0%, #e7dcff 38%, #fff3d6 74%, #ffe6f2 100%);
      border: 2px solid #ede9fe;
      box-shadow: inset 0 0 28px rgba(255, 255, 255, 0.7), 0 8px 20px rgba(124, 58, 237, 0.12);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }
    .embedded-verse-card::before {
      content: '✦';
      position: absolute;
      top: 14px;
      left: 18px;
      font-size: 20px;
      color: #fef08a;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.95);
    }
    .embedded-verse-card::after {
      content: '✧';
      position: absolute;
      bottom: 14px;
      right: 18px;
      font-size: 22px;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(253, 224, 71, 0.95);
    }
    .embedded-verse-text {
      position: relative;
      z-index: 1;
      font-family: 'Gaegu', 'Noto Sans KR', cursive, sans-serif;
      font-size: 24px;
      font-weight: 70
