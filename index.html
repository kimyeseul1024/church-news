<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 광주은광교회 초등2부 교회소식</title>

  <meta property="og:title" content="2026 광주은광교회 초등2부 교회소식">
  <meta property="og:description" content="외울 말씀과 퀴즈, 그리고 신나는 미션이 기다리고 있어요! ✨">
  <meta property="og:image" content="https://kimyeseul1024.github.io/church-news/thumbnail.png">
  <meta property="og:url" content="https://kimyeseul1024.github.io/church-news/">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at center, #fffbeb 0%, #e0f2fe 50%, #fce7f3 100%);
      background-attachment: fixed;
      color: #4a044e;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
        radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
        radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
      background-size: 550px 550px, 350px 350px, 250px 250px;
      background-position: 0 0, 40px 60px, 130px 270px;
      opacity: 0.6;
      z-index: -1;
    }

    .container {
      background: rgba(255, 255, 255, 0.92);
      max-width: 620px;
      width: 100%;
      padding: 35px 24px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(124, 58, 237, 0.15);
      border: 3px solid white;
      backdrop-filter: blur(10px);
    }

    .top-banner {
      width: 100%;
      border-radius: 20px;
      margin-bottom: 25px;
      display: block;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
      border: 4px solid white;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(90deg, #fef08a, #bfdbfe);
      color: #7e22ce;
      font-size: 14px;
      font-weight: 900;
      padding: 8px 20px;
      border-radius: 30px;
      margin-bottom: 16px;
      border: 1px solid #fde047;
    }

    h1 {
      font-size: 20px;
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 24px;
      color: #581c87;
      word-break: keep-all;
    }

    .info-box {
      background: #f5f3ff;
      border: 2px dashed #c4b5fd;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 25px;
      font-size: 15px;
      color: #4c1d95;
      position: relative;
    }
    .info-box::after {
      content: '✨';
      position: absolute; top: -10px; right: -10px;
      font-size: 24px; transform: rotate(15deg);
    }
    .info-box strong { font-weight: 700; color: #6d28d9; }
    .info-box ul { list-style: none; }
    .info-box li { margin-bottom: 12px; word-break: keep-all; line-height: 1.5; display: flex; align-items: flex-start;}
    .info-box li strong { margin-right: 6px; }

    /* 📅 캘린더 아코디언(접기/펼치기) 스타일 */
    .calendar-section {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 22px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.03);
      overflow: hidden;
    }

    .calendar-toggle-btn {
      width: 100%;
      background: #f8fafc;
      border: none;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 900;
      color: #4c1d95;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    .calendar-toggle-btn:hover {
      background: #f1f5f9;
    }
    .calendar-toggle-btn span.arrow {
      font-size: 14px;
      transition: transform 0.3s ease;
    }
    .calendar-toggle-btn.active span.arrow {
      transform: rotate(180deg);
    }

    .calendar-content-wrap {
      display: none;
      padding: 20px;
      border-top: 1px solid #e2e8f0;
    }
    .calendar-content-wrap.active {
      display: block;
    }
    
    .cal-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    .cal-tab-btn {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      background: #f1f5f9;
      color: #64748b;
      transition: all 0.2s;
    }
    .cal-tab-btn.active {
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
      color: white;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }

    .calendar-container {
      display: none;
    }
    .calendar-container.active {
      display: block;
    }

    .calendar-header-title {
      font-size: 18px;
      font-weight: 900;
      color: #1e293b;
      margin-bottom: 14px;
      text-align: center;
    }

    .calendar-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin-bottom: 16px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    .calendar-table th {
      background: #f8fafc;
      color: #475569;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 2px;
      text-align: center;
      border-bottom: 1px solid #e2e8f0;
    }
    .calendar-table th:first-child { color: #ef4444; }
    .calendar-table th:last-child { color: #3b82f6; }

    .calendar-table td {
      height: 62px;
      border: 1px solid #f1f5f9;
      vertical-align: top;
      padding: 4px;
      font-size: 11px;
      position: relative;
    }

    .day-num {
      font-weight: 700;
      font-size: 12px;
      color: #334155;
      display: block;
      margin-bottom: 2px;
    }
    .calendar-table tr td:first-child .day-num { color: #ef4444; }
    .calendar-table tr td:last-child .day-num { color: #3b82f6; }

    .cal-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 4px;
      display: block;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }
    .bg-pink { background: #fce7f3; color: #db2777; }
    .bg-yellow { background: #fef08a; color: #ca8a04; }
    .bg-green { background: #dcfce7; color: #16a34a; }
    .bg-purple { background: #ede9fe; color: #7c3aed; }
    .bg-blue { background: #e0f2fe; color: #0284c7; }

    .schedule-summary {
      background: #f8fafc;
      border-radius: 14px;
      padding: 12px;
      border: 1px solid #e2e8f0;
    }
    .schedule-summary-title {
      font-size: 13px;
      font-weight: 900;
      color: #334155;
      margin-bottom: 8px;
    }
    .schedule-row {
      display: flex;
      align-items: center;
      font-size: 12px;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px dashed #e2e8f0;
    }
    .schedule-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .s-date {
      min-width: 75px;
      font-weight: 700;
      color: #4f46e5;
    }
    .s-desc {
      color: #1e293b;
      font-weight: 700;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 25px;
    }
    .btn {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      font-weight: 900;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      color: white;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      display: block;
      transition: all 0.3s ease;
    }
    .btn:hover { transform: translateY(-3px); }

    .btn-live { background: linear-gradient(135deg, #fb7185, #e11d48); margin-top: 25px; }
    .btn-primary { background: linear-gradient(135deg, #7c3aed, #4c1d95); }
    .btn-secondary { background: linear-gradient(135deg, #34d399, #059669); }
    .btn-accent { background: linear-gradient(135deg, #fbbf24, #d97706); }

    .checklist {
      background: #fffbeb;
      border: 2px solid #fde68a;
      padding: 24px;
      border-radius: 20px;
    }
    .checklist h3 {
      font-size: 17px;
      color: #92400e;
      margin-bottom: 18px;
      font-weight: 900;
    }
    .checklist label {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 15px;
      margin-bottom: 14px;
      cursor: pointer;
      word-break: keep-all;
      line-height: 1.5;
      color: #a16207;
    }
    .checklist input {
      width: 24px; height: 24px;
      margin-top: 2px;
      accent-color: #f59e0b;
      cursor: pointer; flex-shrink: 0;
      appearance: none;
      border: 2px solid #f59e0b;
      border-radius: 6px;
      background-color: white;
      position: relative;
    }
    .checklist input:checked { background-color: #f59e0b; border-color: #f59e0b; }
    .checklist input:checked::after {
      content: '✔';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white; font-size: 16px; font-weight: 900;
    }
    .checklist input:checked + span {
      text-decoration: line-through;
      color: #d97706; opacity: 0.7;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 12px;
      color: #8b5cf6;
      font-weight: 700;
      opacity: 0.8;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center; align-items: center;
      padding: 20px; z-index: 100;
      backdrop-filter: blur(6px);
    }
    .modal-content {
      background: white;
      max-width: 500px; width: 100%;
      padding: 30px;
      border-radius: 30px;
      max-height: 85vh; overflow-y: auto;
      border: 4px solid #a78bfa;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 15px;
    }
    .modal-header strong { font-size: 18px; font-weight: 900; color: #5b21b6; }
    .close-btn {
      background: #f3e8ff; color: #7e22ce;
      border: none; padding: 8px 16px;
      border-radius: 20px; cursor: pointer; font-weight: 900;
    }
    .modal-content img {
      width: 100%; border-radius: 15px;
      margin-bottom: 15px; display: block;
      border: 2px solid #ede9fe;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="bg.jpg" alt="배너" class="top-banner">
    
    <span class="badge">✨ 온 세상에 복음을 전해요!</span>
    <h1>또 이르시되 너희는 온 천하에 다니며 만민에게 복음을 전파하라 (마가복음 16장 15절)</h1>

    <div class="info-box">
      <strong>📢 주요 안내 사항</strong>
      <ul>
        <li>• <strong>1. 추수감사주일</strong> "올 한 해 주신 은혜를 생각하며 감사해요."</li>
        <li>• <strong>2. 하반기 제자훈련</strong> 11/8~29(주일, 4회) 수료 시 국내비전트립 참가자격 부여</li>
        <li>• <strong>3. 전라어린이대회</strong> 출전하는 친구들, 모두 파이팅!!</li>
      </ul>
    </div>

    <!-- 버튼 그룹 (핵심 메뉴들을 먼저 배치해 상단 노출) -->
    <div class="btn-group">
      <button class="btn btn-primary" onclick="openModal('verseModal')">📖 외울말씀 확인하기</button>
      <button class="btn btn-secondary" onclick="openModal('quizModal')">✏️ 퀴즈 확인하기</button>
      <a href="https://notebooklm.link.google/NCNqHkn7f4xa" target="_blank" class="btn btn-accent">🔔 성경골든벨 연습하기</a>
    </div>

    <!-- 🗓️ 캘린더 컴포넌트 (토글 아코디언 형태로 아래로 배치) -->
    <div class="calendar-section">
      <button class="calendar-toggle-btn" onclick="toggleCalendar()">
        <span>📅 11월 · 12월 전체 일정 보기</span>
        <span class="arrow">▼</span>
      </button>
      
      <div id="calendarContent" class="calendar-content-wrap">
        <div class="cal-tabs">
          <button class="cal-tab-btn active" onclick="switchCal('nov')">🍁 11월 일정</button>
          <button class="cal-tab-btn" onclick="switchCal('dec')">🎄 12월 일정</button>
        </div>

        <!-- 11월 캘린더 -->
        <div id="calNov" class="calendar-container active">
          <div class="calendar-header-title">2026년 11월 하반기 일정</div>
          <table class="calendar-table">
            <thead>
              <tr>
                <th>주일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th>
              </tr>
            </thead>
            <tbody>
