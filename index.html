<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 광주은광교회 초등2부 교회소식</title>

  <meta property="og:title" content="2026 광주은광교회 초등2부 교회소식">
  <meta property="og:description" content="외울 말씀과 퀴즈, 그리고 신나는 미션이 기다리고 있어요! ✨">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at center, #fffbeb 0%, #e0f2fe 50%, #fce7f3 100%);
      background-attachment: fixed;
      color: #4a044e;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
        radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
        radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
      background-size: 550px 550px, 350px 350px, 250px 250px;
      background-position: 0 0, 40px 60px, 130px 270px;
      opacity: 0.6;
      z-index: -1;
    }

    .container {
      background: rgba(255, 255, 255, 0.93);
      max-width: 640px;
      width: 100%;
      padding: 35px 22px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(124, 58, 237, 0.15);
      border: 3px solid white;
      backdrop-filter: blur(10px);
    }

    .top-banner {
      width: 100%;
      border-radius: 20px;
      margin-bottom: 25px;
      display: block;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
      border: 4px solid white;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(90deg, #fef08a, #bfdbfe);
      color: #7e22ce;
      font-size: 14px;
      font-weight: 900;
      padding: 8px 20px;
      border-radius: 30px;
      margin-bottom: 16px;
      border: 1px solid #fde047;
    }

    .info-box {
      background: #f5f3ff;
      border: 2px dashed #c4b5fd;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 18px;
      font-size: 15px;
      color: #4c1d95;
      position: relative;
    }
    .info-box::after {
      content: '✨';
      position: absolute; top: -10px; right: -10px;
      font-size: 24px; transform: rotate(15deg);
    }
    .info-box strong { font-weight: 700; color: #6d28d9; }
    .info-box ul { list-style: none; }
    .info-box li { margin-bottom: 12px; word-break: keep-all; line-height: 1.5; display: flex; align-items: flex-start;}
    .info-box li:last-child { margin-bottom: 0; }
    .info-box li strong { margin-right: 6px; flex-shrink: 0; }

    /* 🙏 대표기도 순서 박스 */
    .prayer-box {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 2px solid #fcd34d;
      padding: 18px 20px;
      border-radius: 20px;
      margin-bottom: 25px;
      box-shadow: 0 6px 15px rgba(245, 158, 11, 0.08);
    }
    .prayer-title {
      font-size: 15px;
      font-weight: 900;
      color: #92400e;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .prayer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .prayer-item {
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      border: 1px solid #fde68a;
      transition: all 0.2s ease;
    }
    .prayer-date {
      font-weight: 900;
      color: #b45309;
      background: #fef3c7;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 13px;
    }
    .prayer-name-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prayer-name {
      font-weight: 700;
      color: #451a03;
    }

    .prayer-item.past {
      background: rgba(241, 245, 249, 0.75);
      border-color: #e2e8f0;
      opacity: 0.6;
    }
    .prayer-item.past .prayer-date {
      background: #e2e8f0;
      color: #64748b;
    }
    .prayer-item.past .prayer-name {
      color: #64748b;
      text-decoration: line-through;
    }

    .prayer-item.next-up {
      background: #ffffff;
      border: 2.5px solid #f59e0b;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.22);
      transform: scale(1.01);
    }
    .prayer-item.next-up .prayer-date {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
    }
    .prayer-item.next-up .prayer-name {
      font-weight: 900;
      font-size: 15px;
      color: #78350f;
    }
    .next-badge {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fcd34d;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* 🏰 디즈니 컬러조합 6개 액션 버튼 그룹 */
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }
    .btn {
      flex: 1 1 calc(50% - 10px);
      min-width: 145px;
      padding: 19px 14px;
      font-size: 17px;
      font-weight: 900;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      cursor: pointer;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.25s ease;
      word-break: keep-all;
      line-height: 1.35;
      letter-spacing: -0.3px;
      text-shadow: 0 1px 4px rgba(30, 27, 75, 0.28);
    }
    .btn:hover { transform: translateY(-3px); }

    .btn-live { 
      width: 100%;
      padding: 19px;
      font-size: 18px;
      background: linear-gradient(135deg, #fb7185, #e11d48);
      box-shadow: 0 8px 20px rgba(225, 29, 72, 0.28);
      margin-top: 12px; 
    }

    .btn-primary {
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 55%, #2563eb 100%);
      box-shadow: 0 8px 18px rgba(59, 130, 246, 0.28);
    }
    .btn-secondary {
      background: linear-gradient(135deg, #c084fc 0%, #a855f7 55%, #7e22ce 100%);
      box-shadow: 0 8px 18px rgba(168, 85, 247, 0.28);
    }
    .btn-toon {
      background: linear-gradient(135deg, #f472b6 0%, #ec4899 55%, #db2777 100%);
      box-shadow: 0 8px 18px rgba(236, 72, 153, 0.28);
    }
    .btn-home {
      background: linear-gradient(135deg, #fb923c 0%, #f97316 55%, #ea580c 100%);
      box-shadow: 0 8px 18px rgba(249, 115, 22, 0.28);
    }
    .btn-accent {
      background: linear-gradient(270deg, #fde047, #facc15, #fb923c, #f472b6, #fde047);
      background-size: 350% 350%;
      color: #3b0764;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
      border: 2.5px solid #ffffff;
      animation: rainbowShift 3s ease infinite, dazzlingPulse 1.15s ease-in-out infinite alternate;
    }
    @keyframes rainbowShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes dazzlingPulse {
      0% {
        box-shadow: 0 6px 16px rgba(250, 204, 21, 0.45), 0 0 12px rgba(253, 224, 71, 0.7);
      }
      100% {
        box-shadow: 0 10px 28px rgba(244, 114, 182, 0.75), 0 0 24px rgba(255, 255, 255, 1);
      }
    }
    .btn-info {
      background: linear-gradient(135deg, #2dd4bf 0%, #14b8a6 55%, #0d9488 100%);
      box-shadow: 0 8px 18px rgba(20, 184, 166, 0.28);
    }

    /* 📅 오픈형 캘린더 섹션 */

      background: #ffffff;

    }
    .calendar-open-header {

      color: #4c1d95;
      border-bottom: 1px solid #e2e8f0;

      align-items: center;

    .calendar-content-wrap {

    .cal-tab-btn.active {
      background: linear-gradient(135deg, #7c3aed, #4c1d95);

      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }
    .calendar-container { display: none; }
    .calendar-container.active { display: block; }
    .calendar-header-title {
      font-size: 18px;

    }
    .calendar-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;

      border: 1px solid #e2e8f0;
    }

      background: #f8fafc;

    .calendar-table tr td:last-child .day-num { color: #3b82f6; }
    .weekday-col { background: #fafaf9; }
    .cal-badge {
      font-size: 9px;

      padding: 2px 3px;

      letter-spacing: -0.4px;
    }
    .bg-pink { background: #fce7f3; color: #db2777; }
    .bg-yellow { background: #fef08a; color: #ca8a04; }

    .bg-red { background: #fee2e2; color: #dc2626; }

    .schedule-summary {
      background: #f8fafc;
      border-radius: 14px;
      padding: 12px;
      border: 1px solid #e2e8f0;
    }
    .schedule-summary-title {
      font-size: 13px;
      font-weight: 900;
      color: #334155;
      margin-bottom: 8px;
    }
    .schedule-row {
      display: flex;
      align-items: center;
      font-size: 12px;
      margin-bottom: 6px;

      border-bottom: 1px dashed #e2e8f0;
    }
    .schedule-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .s-date { min-width: 95px; font-weight: 700; color: #4f46e5; }
    .s-desc { color: #1e293b; font-weight: 700; }

      margin-bottom: 24px;
