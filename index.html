<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 광주은광교회 초등2부 교회소식</title>

  <meta property="og:title" content="2026 광주은광교회 초등2부 교회소식">
  <meta property="og:description" content="이번 주 외울 말씀과 복습 퀴즈를 확인해 보세요!">
  <meta property="og:image" content="https://kimyeseul1024.github.io/church-news/thumbnail.png">
  <meta property="og:url" content="https://kimyeseul1024.github.io/church-news/">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f4f8;
      color: #333;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #ffffff;
      max-width: 600px;
      width: 100%;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .top-banner {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
      display: block;
    }
    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #1e293b;
      word-break: keep-all;
    }
    .info-box {
      background: #f8fafc;
      border-left: 4px solid #3b82f6;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #334155;
    }
    .info-box ul {
      list-style: none;
    }
    .info-box li {
      margin-bottom: 6px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: #fff;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .btn-primary { 
      background: linear-gradient(135deg, #3b82f6, #1d4ed8); 
    }
    .btn-secondary { 
      background: linear-gradient(135deg, #10b981, #059669); 
    }
    .checklist {
      background: #fffbeb;
      border: 1px solid #fde68a;
      padding: 15px;
      border-radius: 10px;
    }
    .checklist h3 {
      font-size: 15px;
      color: #92400e;
      margin-bottom: 10px;
    }
    .checklist label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .checklist input {
      width: 18px;
      height: 18px;
      accent-color: #f59e0b;
      cursor: pointer;
    }
    .checklist input:checked + span {
      text-decoration: line-through;
      color: #9ca3af;
    }
    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-content {
      background: #fff;
      max-width: 500px;
      width: 100%;
      padding: 20px;
      border-radius: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .close-btn {
      background: #e2e8f0;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .modal-content img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="bg.jpg" alt="배너" class="top-banner">
    
    <span class="badge">✨ 온 세상에 복음을 전해요!</span>
    <h1>또 이르시되 너희는 온 천하에 다니며 만민에게 복음을 전파하라 (마가복음 16장 15절)</h1>

    <div class="info-box">
      <strong>📢 주요 안내 사항</strong>
      <ul>
        <li>• 1. 추수감사주일: 한 해 동안 받은 은혜를 생각하며 감사하는 시간을 가집시다.</li>
        <li>• 2. 하반기 제자훈련 (11/8~29 주일)</li>
        <li>• 3. 전라어린이대회 (11/21 토, 광주은광교회) 출전하는 친구들 초등부 예배 후 모임이 있습니다.</li>
      </ul>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="openModal('verseModal')">📖 외울말씀 확인하기</button>
      <button class="btn btn-secondary" onclick="openModal('quizModal')">✏️ 퀴즈 확인하기</button>
    </div>

    <div class="checklist">
      <h3>✅ 이번 주 미션 체크리스트</h3>
      <label><input type="checkbox"> <span>성경책 가져오기</span></label>
      <label><input type="checkbox"> <span>성경읽기 (5장 이상)</span></label>
      <label><input type="checkbox"> <span>성경암송</span></label>
    </div>

    <footer>© 2026 yeseuly. All Rights Reserved.</footer>
  </div>

  <div id="verseModal" class="modal" onclick="closeOutside(event, 'verseModal')">
    <div class="modal-content">
      <div class="modal-header">
        <strong>외울 말씀</strong>
        <button class="close-btn" onclick="closeModal('verseModal')">닫기</button>
      </div>
      <img src="verse.jpg" alt="외울말씀 이미지">
    </div>
  </div>

  <div id="quizModal" class="modal" onclick="closeOutside(event, 'quizModal')">
    <div class="modal-content">
      <div class="modal-header">
        <strong>복습 퀴즈</strong>
        <button class="close-btn" onclick="closeModal('quizModal')">닫기</button>
      </div>
      <img src="quiz01.png" alt="퀴즈 1">
      <img src="quiz02.png" alt="퀴즈 2">
    </div>
  </div>

  <script>
    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }
    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }
    function closeOutside(event, id) {
      if (event.target.id === id) {
        closeModal(id);
      }
    }
  </script>

</body>
</html>
